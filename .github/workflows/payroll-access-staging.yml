name: Payroll access staging validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sql/staging_workforce_*.sql'
      - '.github/workflows/payroll-access-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Build
        id: build
        run: npm run build
      - name: Check for unintentional frontend service role keys
        run: |
          if grep -R -n -E 'VITE_SUPABASE_SERVICE_ROLE|VITE_SERVICE_ROLE_KEY' src; then
            echo 'Service role key reference found in browser source'
            exit 1
          fi
          echo 'No service role key references found'
      - name: Enforce lint result after build and security checks
        if: always()
        run: |
          if [ '${{ steps.lint.outcome }}' != 'success' ]; then
            echo 'Lint remains a blocking check; build and key checks ran independently.'
            exit 1
          fi
